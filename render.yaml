# Render Blueprint: one free web service that serves the app and the Socket.io game server.
services:
  - type: web
    name: doodlz
    runtime: node
    plan: free
    # --include=dev: Vite/TypeScript are devDependencies but are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      # Accounts are saved in Supabase (run supabase/schema.sql once). Set these in the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Email (verification codes) via Resend. MAIL_FROM must be on a domain verified in Resend, e.g. Doodlz <noreply@doodlz.io>.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Shown in the footer, Contact page and policies.
      - key: VITE_BUSINESS_NAME
        sync: false
      - key: VITE_BUSINESS_ADDRESS
        sync: false
      - key: VITE_CONTACT_EMAIL
        sync: false
