<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>doodlz.io</title>
    <meta name="description" content="Free multiplayer drawing and guessing game. Draw, guess, and play with friends." />
    <!-- Apply the saved theme before anything is drawn, so dark mode never flashes light on load. -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('doodlz:settings') || '{}').theme) || 'system';
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Safari draws the wobbly crayon outlines (SVG filters on CSS) on the CPU and redraws them on every change
      // inside the box, which makes drawing lag. It gets plain outlines instead (see .plain-edges in index.css).
      var ua = navigator.userAgent;
      if (/AppleWebKit/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Android/.test(ua)) document.documentElement.classList.add('plain-edges');
    </script>
    <!-- The page colour before the stylesheet arrives (matches body in index.css). -->
    <style>
      html { background: #5b3fe0 linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%) fixed; color-scheme: light; }
      html.dark { background: #1d1342 linear-gradient(135deg, #17123a 0%, #2a1250 50%, #45103a 100%) fixed; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
